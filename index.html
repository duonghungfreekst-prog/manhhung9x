<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="DMH_Tools - Công cụ đối chiếu hồ sơ và chuyển đổi định dạng" />
    <!--
      Bảo mật #4.9: Content Security Policy
      - script-src 'self': chỉ cho phép script từ origin này
        (KHÔNG có unsafe-eval — Vite production build đã bundle tĩnh hoàn toàn)
      - style-src 'self' 'unsafe-inline': React dùng inline styles
      - worker-src blob:: Tesseract.js và PDF.js dùng blob worker
      - img-src data: blob:: canvas export, PDF thumbnail
      - connect-src blob:: đọc file qua FileReader/blob URL
      - https://tessdata.projectnaptha.com: Tesseract language pack CDN
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      img-src 'self' data: blob:;
      font-src 'self' data: https://fonts.gstatic.com;
      connect-src 'self' blob: data:
        https://api.github.com
        https://github.com
        https://raw.githubusercontent.com
        https://objects.githubusercontent.com
        https://tessdata.projectnaptha.com;
      worker-src 'self' blob:;
      object-src 'none';
      base-uri 'self';
    " />
    <title>DMH_Tools</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
